[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verifications-email"
version = "0.1.0"
description = "Official Python SDK for the EVA Email Verification API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]
keywords = [
    "email",
    "verification",
    "validation",
    "api",
    "sdk",
    "eva",
    "email-validation",
    "email-verification",
    "disposable-email",
    "smtp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://verifications.email"
Repository = "https://github.com/verifications-email/eva-sdk-python"
Documentation = "https://developer.verifications.email"

[tool.hatch.build.targets.wheel]
packages = ["eva_email"]
